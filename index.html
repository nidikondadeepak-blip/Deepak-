<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Konoha Village</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#071018;font-family:Trebuchet MS,Segoe UI,sans-serif;color:#fff}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:16px}
#title{letter-spacing:.28em;font-size:12px;color:#ffe08a;text-shadow:0 2px 8px #000}
#stats{margin-top:12px;width:260px;display:grid;gap:8px;font-size:11px;letter-spacing:.12em}
.stat{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px}
.bar{height:10px;background:#1a2438;border:1px solid #c9a227;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,#e74c3c)}
.bar.chakra i{background:linear-gradient(90deg,#1e6fd9,#5ad0ff)}
#mission{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;background:rgba(8,12,24,.78);border:1px solid #c9a227;padding:10px 16px;border-radius:8px;font-size:13px}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid #ffe08a;padding:8px 14px;border-radius:8px;z-index:6;display:none}
#err{position:fixed;left:12px;right:12px;bottom:12px;background:#4a1515;color:#ffd0d0;padding:10px;z-index:50;display:none;white-space:pre-wrap;font-size:12px}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a2a18, #05080e 70%);pointer-events:auto}
.card{width:min(500px,92vw);text-align:center;padding:32px 24px;background:rgba(10,16,12,.9);border:2px solid #c9a227;border-radius:16px}
h1{font-size:48px;letter-spacing:.18em;color:#ffe08a}
.sub{color:#7dcf6a;letter-spacing:.35em;margin:6px 0 14px}
.card p{color:#cdd6c8;line-height:1.5;margin-bottom:14px}
#start{cursor:pointer;background:linear-gradient(#e8c547,#b8860b);border:0;color:#1a1204;font-weight:800;letter-spacing:.12em;padding:14px 28px;border-radius:8px;font-size:16px}
#joy{position:fixed;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,224,138,.5);z-index:9;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,224,138,.9);pointer-events:none}
#acts{position:fixed;right:16px;bottom:18px;z-index:9;display:flex;flex-direction:column;gap:10px}
#acts button{width:84px;height:84px;border-radius:50%;border:2px solid #c9a227;background:rgba(12,16,10,.75);color:#ffe08a;font-weight:800;font-size:11px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="title">KONOHA — SHADOW OF THE LEAF</div>
  <div id="stats">
    <div class="stat"><span>HP</span><div class="bar"><i id="hp"></i></div></div>
    <div class="stat"><span>CHAKRA</span><div class="bar chakra"><i id="ck"></i></div></div>
    <div class="stat"><span>SCROLLS</span><b id="sc">0 / 8</b></div>
  </div>
  <div id="mission">Collect 8 scrolls. WASD move · drag to look · click Rasengan</div>
</div>
<div id="toast"></div>
<div id="err"></div>
<div id="menu">
  <div class="card">
    <h1>KONOHA</h1>
    <p class="sub">Hidden Leaf</p>
    <p>Walk the village, talk to shinobi, collect forbidden scrolls, and fire Rasengan.</p>
    <button id="start" type="button">Enter the Village</button>
  </div>
</div>
<div id="joy"><i id="knob"></i></div>
<div id="acts">
  <button type="button" id="bj">JUMP</button>
  <button type="button" id="br">RASENGAN</button>
  <button type="button" id="bt">TALK</button>
</div>
<script>
window.onerror = function(m,s,l,c,e){
  var el=document.getElementById('err');
  el.style.display='block';
  el.textContent=String(m)+' @'+l;
};
(function(){
  var canvas=document.getElementById('game');
  var ctx=canvas.getContext('2d');
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  var keys={}; var stick={x:0,y:0};
  window.addEventListener('keydown', function(e){ keys[e.code]=true; });
  window.addEventListener('keyup', function(e){ keys[e.code]=false; });

  var playing=false, yaw=0, pitch=0.12;
  var P={x:0,y:0,z:24,vy:0};
  var hp=100, chakra=100, got=0;
  var orbs=[];

  var npcs=[
    {n:'Sasuke', t:'Hn. Get the scrolls, dobe.', x:8, z:12, h:'#111', v:'#1c2833'},
    {n:'Sakura', t:'Check the stalls and ramen shop.', x:-8, z:12, h:'#f5b7b1', v:'#d35400'},
    {n:'Kakashi', t:'A ninja sees underneath the underneath.', x:4, z:-26, h:'#bbb', v:'#1e8449'},
    {n:'Tsunade', t:'Eight scrolls. Then we talk.', x:2, z:-38, h:'#f9e79f', v:'#1e8449'},
    {n:'Teuchi', t:'Ramen when you finish!', x:-34, z:22, h:'#7b5e3b', v:'#eee'}
  ];
  var scrolls=[[0,-36],[36,6],[-34,20],[0,10],[-44,-14],[26,14],[-18,4],[8,-66]].map(function(p){return {x:p[0],z:p[1],ok:false};});

  var boxes=[];
  function box(x,y,z,w,h,d,c){ boxes.push({x:x,y:y,z:z,w:w,h:h,d:d,c:c}); }
  box(0,20,-92,150,40,26,'#6b5a48');
  box(0,4,-40,36,8,28,'#8d8a84');
  box(0,11,-40,32,6,24,'#c0392b');
  box(0,17,-40,26,5.5,20,'#e74c3c');
  box(0,22,-40,20,5,16,'#c0392b');
  box(0,26,-40,22,3,18,'#d4a017');
  function house(x,z,w,d,h,wall,roof){ box(x,h/2,z,w,h,d,wall); box(x,h+1.1,z,w+1.4,2.2,d+1.4,roof); }
  house(-28,16,12,10,6,'#e8c96a','#7b3f11');
  house(-40,8,10,9,5,'#d4a017','#922b21');
  house(-32,-6,11,8,5.5,'#c9a66b','#6e2c1f');
  house(30,16,12,10,7,'#f5e6c8','#c0392b');
  house(42,6,14,11,8,'#b03a2e','#7b241c');
  house(34,-8,10,9,6,'#eadcc8','#922b21');
  house(-36,22,10,8,4,'#f5e6c8','#c0392b');
  box(-46,5,-16,11,10,11,'#f5e6c8');
  box(-46,14,-16,13,8,13,'#2471a3');
  var i;
  for(i=0;i<6;i++) box(-10+(i%3)*10,1.1,8+Math.floor(i/3)*8,5,2.2,4,'#6e4c2a');
  for(i=0;i<28;i++){
    var a=i/28*Math.PI*2, r=72+(i*19)%80;
    var tx=Math.cos(a)*r, tz=Math.sin(a)*r;
    box(tx,2,tz,1.2,4,1.2,'#5a3a22');
    box(tx,6.4,tz,4,4.4,4,'#2e7a32');
  }
  var fx=[-42,-28,-14,0,14,28,42];
  for(i=0;i<fx.length;i++){ box(fx[i],38,-78,10,12,6,'#c4a882'); box(fx[i],45,-78,11,2.2,6.4,'#2f4a32'); }
  box(0,1.1,34,48,0.3,0.4,'#c0392b');

  function toast(t){
    var el=document.getElementById('toast');
    el.textContent=t; el.style.display='block';
    clearTimeout(toast._t); toast._t=setTimeout(function(){ el.style.display='none'; }, 1500);
  }
  function talk(){
    var n, d, best=null, bd=9;
    for(i=0;i<npcs.length;i++){
      n=npcs[i]; d=Math.hypot(n.x-P.x,n.z-P.z);
      if(d<bd){ bd=d; best=n; }
    }
    if(best) toast(best.n+': '+best.t);
  }
  function rasengan(){
    if(!playing || chakra<12) return;
    chakra-=12;
    var s=Math.sin(yaw), c=Math.cos(yaw);
    orbs.push({x:P.x+s*2,y:1.4,z:P.z+c*2,vx:s*26,vz:c*26,life:1.3});
    toast('Rasengan!');
  }

  document.getElementById('start').onclick=function(){
    document.getElementById('menu').style.display='none';
    playing=true;
  };
  document.getElementById('bj').onpointerdown=function(e){ e.preventDefault(); keys.Space=true; };
  document.getElementById('bj').onpointerup=function(){ keys.Space=false; };
  document.getElementById('br').onpointerdown=function(e){ e.preventDefault(); rasengan(); };
  document.getElementById('bt').onpointerdown=function(e){ e.preventDefault(); talk(); };
  window.addEventListener('keydown', function(e){ if(e.code==='KeyE') talk(); });

  var drag=false, lx=0, ly=0;
  canvas.addEventListener('pointerdown', function(e){
    drag=true; lx=e.clientX; ly=e.clientY;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  });
  canvas.addEventListener('pointermove', function(e){
    if(!drag) return;
    yaw -= (e.clientX-lx)*0.005;
    pitch = Math.max(-0.25, Math.min(0.7, pitch+(e.clientY-ly)*0.004));
    lx=e.clientX; ly=e.clientY;
  });
  canvas.addEventListener('pointerup', function(){ drag=false; });
  canvas.addEventListener('click', function(e){ if(playing && e.clientX>innerWidth*0.55) rasengan(); });

  (function(){
    var joy=document.getElementById('joy'), knob=document.getElementById('knob'), pid=null;
    function setS(cx,cy,x,y){
      var dx=x-cx, dy=y-cy, len=Math.hypot(dx,dy)||1, m=Math.min(46,len);
      stick.x=(dx/len)*(m/46); stick.y=(dy/len)*(m/46);
      knob.style.transform='translate('+stick.x*46+'px,'+stick.y*46+'px)';
    }
    joy.addEventListener('pointerdown', function(e){
      e.stopPropagation(); pid=e.pointerId; joy.setPointerCapture(pid);
      var r=joy.getBoundingClientRect();
      setS(r.left+r.width/2, r.top+r.height/2, e.clientX, e.clientY);
    });
    joy.addEventListener('pointermove', function(e){
      if(e.pointerId!==pid) return;
      var r=joy.getBoundingClientRect();
      setS(r.left+r.width/2, r.top+r.height/2, e.clientX, e.clientY);
    });
    joy.addEventListener('pointerup', function(){ pid=null; stick.x=stick.y=0; knob.style.transform=''; });
  })();

  function project(px,py,pz,cam,eye){
    var dx=px-eye.x, dy=py-eye.y, dz=pz-eye.z;
    var x=dx*cam.rx+dy*cam.ry+dz*cam.rz;
    var y=dx*cam.ux+dy*cam.uy+dz*cam.uz;
    var z=dx*cam.fx+dy*cam.fy+dz*cam.fz;
    if(z<0.55) return null;
    var f=1.12*canvas.height/z;
    return {x:canvas.width/2+x*f, y:canvas.height/2-y*f, z:z};
  }
  function shade(hex,k){
    var n=parseInt(hex.slice(1),16);
    var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255,r*k)); g=Math.max(0,Math.min(255,g*k)); b=Math.max(0,Math.min(255,b*k));
    return 'rgb('+((r)|0)+','+((g)|0)+','+((b)|0)+')';
  }

  var faces=[];
  function boxFaces(b,cam,eye){
    var hx=b.w/2, hy=b.h/2, hz=b.d/2;
    var C=[[b.x-hx,b.y-hy,b.z-hz],[b.x+hx,b.y-hy,b.z-hz],[b.x+hx,b.y+hy,b.z-hz],[b.x-hx,b.y+hy,b.z-hz],
           [b.x-hx,b.y-hy,b.z+hz],[b.x+hx,b.y-hy,b.z+hz],[b.x+hx,b.y+hy,b.z+hz],[b.x-hx,b.y+hy,b.z+hz]];
    var P3=[], j;
    for(j=0;j<8;j++) P3[j]=project(C[j][0],C[j][1],C[j][2],cam,eye);
    var F=[[0,1,2,3,0.72],[5,4,7,6,1.05],[4,0,3,7,0.82],[1,5,6,2,0.9],[3,2,6,7,1.12],[4,5,1,0,0.55]];
    for(j=0;j<6;j++){
      var f=F[j], p=[P3[f[0]],P3[f[1]],P3[f[2]],P3[f[3]]];
      if(!p[0]||!p[1]||!p[2]||!p[3]) continue;
      faces.push({pts:p, col:shade(b.c,f[4]), z:(p[0].z+p[1].z+p[2].z+p[3].z)/4});
    }
  }

  function drawChar(x,y,z,hair,vest,cam,eye,label){
    var p=project(x,y+1.2,z,cam,eye); if(!p) return;
    var s=Math.max(6, 170/p.z);
    faces.push({z:p.z, fn:function(){
      ctx.fillStyle=vest; ctx.fillRect(p.x-s*0.35, p.y-s*0.1, s*0.7, s*0.9);
      ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.arc(p.x, p.y-s*0.35, s*0.32, 0, 6.3); ctx.fill();
      ctx.fillStyle=hair; ctx.beginPath(); ctx.arc(p.x, p.y-s*0.5, s*0.3, Math.PI, 6.3); ctx.fill();
      if(label){ ctx.fillStyle='#ffe08a'; ctx.font=Math.max(10,s*0.32)+'px Trebuchet MS,sans-serif'; ctx.textAlign='center'; ctx.fillText(label,p.x,p.y-s*1.05); }
    }});
  }

  var last=performance.now();
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    if(playing){
      var speed=(keys.ShiftLeft||keys.ShiftRight)?16:9;
      var sy=Math.sin(yaw), cy=Math.cos(yaw);
      var mx=0, mz=0;
      if(keys.KeyW){ mx+=sy; mz+=cy; }
      if(keys.KeyS){ mx-=sy; mz-=cy; }
      if(keys.KeyA){ mx+=cy; mz-=sy; }
      if(keys.KeyD){ mx-=cy; mz+=sy; }
      mx += -stick.y*sy + -stick.x*cy;
      mz += -stick.y*cy + stick.x*sy;
      var L=Math.hypot(mx,mz);
      if(L>0.01){ P.x+=(mx/L)*speed*dt; P.z+=(mz/L)*speed*dt; }
      if(keys.Space && P.y<0.05) P.vy=8;
      P.vy-=22*dt; P.y+=P.vy*dt; if(P.y<0){P.y=0;P.vy=0;}
      P.x=Math.max(-130,Math.min(130,P.x)); P.z=Math.max(-130,Math.min(130,P.z));
      for(i=0;i<scrolls.length;i++){
        var s=scrolls[i]; if(s.ok) continue;
        if(Math.hypot(s.x-P.x,s.z-P.z)<2.5){
          s.ok=true; got++; document.getElementById('sc').textContent=got+' / 8';
          toast('Scroll '+got+'/8');
          if(got>=8){ document.getElementById('mission').textContent='Mission complete! Believe it!'; toast('MISSION COMPLETE'); }
        }
      }
      for(i=orbs.length-1;i>=0;i--){
        var o=orbs[i]; o.x+=o.vx*dt; o.z+=o.vz*dt; o.life-=dt; if(o.life<=0) orbs.splice(i,1);
      }
      chakra=Math.min(100,chakra+dt*9);
      document.getElementById('hp').style.width=hp+'%';
      document.getElementById('ck').style.width=chakra+'%';
    }

    var eye, cam;
    if(playing){
      eye={x:P.x-Math.sin(yaw)*8, y:3.1+P.y+pitch*4, z:P.z-Math.cos(yaw)*8};
    } else {
      yaw=now*0.0001; pitch=0.16;
      eye={x:Math.sin(now*0.0001)*8, y:15, z:46};
    }
    var cp=Math.cos(pitch), sp=Math.sin(pitch), cy=Math.cos(yaw), sy=Math.sin(yaw);
    cam={fx:sy*cp, fy:-sp, fz:cy*cp, rx:cy, ry:0, rz:-sy, ux:sy*sp, uy:cp, uz:cy*sp};

    var grd=ctx.createLinearGradient(0,0,0,canvas.height);
    grd.addColorStop(0,'#7eb6e8'); grd.addColorStop(0.52,'#b8d4ea'); grd.addColorStop(0.52,'#4a8a3c'); grd.addColorStop(1,'#2d5a28');
    ctx.fillStyle=grd; ctx.fillRect(0,0,canvas.width,canvas.height);

    faces.length=0;
    for(i=0;i<boxes.length;i++) boxFaces(boxes[i], cam, eye);
    for(i=0;i<npcs.length;i++) drawChar(npcs[i].x,0,npcs[i].z,npcs[i].h,npcs[i].v,cam,eye,npcs[i].n);
    if(playing) drawChar(P.x,P.y,P.z,'#f4d03f','#e67e22',cam,eye,'');
    for(i=0;i<scrolls.length;i++){
      if(scrolls[i].ok) continue;
      var bob=Math.sin(now*0.004+scrolls[i].x)*0.25;
      var p=project(scrolls[i].x,1.2+bob,scrolls[i].z,cam,eye);
      if(!p) continue;
      faces.push({z:p.z, fn:function(pp){ return function(){
        var r=Math.max(4,70/pp.z);
        ctx.fillStyle='#f5cba7'; ctx.fillRect(pp.x-r, pp.y-r*0.4, r*2, r*0.8);
        ctx.strokeStyle='#c0392b'; ctx.strokeRect(pp.x-r, pp.y-r*0.4, r*2, r*0.8);
      }; }(p)});
    }
    for(i=0;i<orbs.length;i++){
      var op=project(orbs[i].x,orbs[i].y,orbs[i].z,cam,eye);
      if(!op) continue;
      faces.push({z:op.z, fn:function(pp){ return function(){
        ctx.fillStyle='#4fc3f7'; ctx.beginPath(); ctx.arc(pp.x,pp.y,Math.max(4,90/pp.z),0,6.3); ctx.fill();
      }; }(op)});
    }
    faces.sort(function(a,b){ return b.z-a.z; });
    for(i=0;i<faces.length;i++){
      var f=faces[i];
      if(f.fn) f.fn();
      else {
        ctx.beginPath(); ctx.moveTo(f.pts[0].x,f.pts[0].y);
        ctx.lineTo(f.pts[1].x,f.pts[1].y); ctx.lineTo(f.pts[2].x,f.pts[2].y); ctx.lineTo(f.pts[3].x,f.pts[3].y);
        ctx.closePath(); ctx.fillStyle=f.col; ctx.fill();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
